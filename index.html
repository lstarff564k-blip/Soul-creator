<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soul Creator</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c12;--panel:#151722;--panel2:#1d2030;--line:#2c3047;--fg:#eceef6;--dim:#8d92ab;--ac:#ffd84a;--acd:#1a1400;--bad:#ff5d6c;--dw:clamp(190px,52vw,340px);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:10px/1.8 'Press Start 2P',monospace;-webkit-font-smoothing:none}
#app{max-width:440px;margin:0 auto;padding:18px 16px 24px}
#app.ed{max-width:none;padding:0}
h1{font-size:15px;font-weight:normal;margin:6px 0 6px;letter-spacing:.5px}
p{color:var(--dim);margin:0 0 6px}
.hd{border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:14px}

.b{font:inherit;background:var(--panel2);color:var(--fg);border:2px solid var(--line);border-radius:4px;padding:11px 13px;cursor:pointer;margin:2px;transition:border-color .12s,color .12s,background .12s}
.b:hover{border-color:var(--dim)}
.b:active,.b.on{color:var(--ac);border-color:var(--ac)}
.b:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.b.pri{background:var(--ac);color:var(--acd);border-color:var(--ac)}
.b.pri:active{filter:brightness(.9);color:var(--acd)}
.b.dng.on,.b.dng:active{color:var(--bad);border-color:var(--bad)}
svg.i{width:12px;height:12px;fill:currentColor;flex:none;display:block}

/* library */
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.cd{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px;text-align:center;cursor:pointer;transition:border-color .12s}
.cd:hover{border-color:var(--ac)}
.cd>div:not(.pl){margin:8px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd .b{width:100%;margin:6px 0 0;font-size:8px;padding:8px 4px;background:transparent;color:var(--dim)}
.cd .b.on{color:var(--bad);border-color:var(--bad)}
.pl{font-size:34px;color:var(--dim);display:flex;align-items:center;justify-content:center;min-height:170px;border-style:dashed}
.pl:hover{color:var(--ac)}
.sc{display:block;width:100%;image-rendering:pixelated;background:#050509;border-radius:3px}

/* editor layout */
.mn{padding:14px 16px 20px;transition:padding .25s}
.ed.open .mn{padding-left:12px;padding-right:calc(var(--dw) + 12px)}
.mi{max-width:540px;margin:0 auto}
.stage{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px}
#ec{display:block;width:100%;max-width:min(540px,calc(100vh - 260px));max-width:min(540px,calc(100dvh - 260px));margin:0 auto;border:2px solid var(--line);touch-action:none}
input[type=text]{font:inherit;width:100%;background:var(--panel);color:var(--fg);border:2px solid var(--line);border-radius:4px;padding:12px;box-sizing:border-box;margin-bottom:12px}
input[type=text]::placeholder{color:var(--dim)}
.bar{display:flex;gap:8px;margin-top:12px}
.bar .b{flex:1;margin:0;text-align:center}

/* side editor */
.tgb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:42px;height:42px;z-index:6;padding:0;margin:0;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;background:var(--ac);color:var(--acd);border:2px solid var(--ac);border-radius:6px;transition:right .25s}
.tgb span{display:block;transition:transform .25s}
.ed.open .tgb{right:calc(var(--dw) + 12px)}
.ed.open .tgb span{transform:rotate(45deg)}
.dr{position:fixed;top:0;right:0;bottom:0;width:var(--dw);box-sizing:border-box;background:var(--panel);border-left:2px solid var(--line);z-index:5;overflow-y:auto;overscroll-behavior:contain;font-size:8px;
 padding:calc(env(safe-area-inset-top,0px) + 14px) 10px calc(env(safe-area-inset-bottom,0px) + 18px);
 transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility 0s .25s}
.ed.open .dr{transform:none;visibility:visible;transition:transform .25s}
.dr .b{padding:9px 8px;font-size:8px}
.dr .pn{background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:10px;margin:8px 0}
.dr details{margin:8px 0}
.dr summary.b{display:flex;justify-content:space-between;align-items:center;list-style:none;margin:0;padding:11px 10px}
.dr summary.b::after{content:'+';color:var(--dim)}
.dr details[open]>summary.b::after{content:'\2212';color:var(--ac)}
.dr summary::-webkit-details-marker{display:none}
.dr details[open]>summary{color:var(--ac);border-color:var(--ac)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tools .b{display:flex;align-items:center;gap:6px;margin:0}
.f{margin:10px 0}.f:first-child{margin-top:0}.f>span{display:block;color:var(--dim);margin-bottom:5px}
.rg{display:flex;align-items:center;gap:6px}
.rg input[type=range]{flex:1;min-width:0;accent-color:var(--ac);height:24px;margin:0}
.rg output{min-width:28px;text-align:right}
.rg .b{margin:0;flex:none}
input[type=color]{width:100%;height:34px;border:2px solid var(--line);border-radius:4px;background:var(--panel2);padding:2px;cursor:pointer;box-sizing:border-box}
select{font:inherit;font-size:8px;width:100%;background:var(--panel2);color:var(--fg);border:2px solid var(--line);border-radius:4px;padding:10px 6px;box-sizing:border-box}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}.two .b{margin:0}
.shg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shg .b{margin:0;padding:8px 0;display:flex;justify-content:center}
.wide{width:100%;margin:8px 0 2px!important}
.lb{color:var(--dim);margin:10px 0 4px}
.thg{display:grid;gap:6px}.thg.w{grid-template-columns:repeat(3,1fr)}.thg.k{grid-template-columns:repeat(4,1fr)}
.th{margin:0!important;padding:4px!important;height:46px;display:flex;align-items:center;justify-content:center}
.th img,.ch img{image-rendering:pixelated;max-width:100%;max-height:100%}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ch{margin:0!important;padding:5px 6px!important;display:flex;align-items:center;gap:4px;height:34px;box-sizing:border-box}
.ch img{height:20px;width:auto}.ch svg.i{width:14px;height:14px}.ch i{font-style:normal}
</style></head><body><div id="app"></div>
